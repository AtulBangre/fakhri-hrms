{% extends "base.html" %}
{% block title %}Change password · {{ org_name }}{% endblock %}
{% block brandsub %}My space{% endblock %}

{% block content %}
<div class="page-head">
  <div class="titles">
    <h1>Change password</h1>
    <div class="sub">Changing it signs you out on every other device.</div>
  </div>
  <div class="page-actions"><a class="btn" href="/me/profile">{{ icon('chevron-left') }} My profile</a></div>
</div>

<div class="card" style="max-width:480px">
  <div class="card-body">
    <form method="post" action="/me/password">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="field"><label for="current">Current password</label>
        <input id="current" name="current" type="password" required autocomplete="current-password"></div>
      <div class="field"><label for="password">New password</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"
               placeholder="at least 8 characters"></div>
      <div class="field"><label for="confirm">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password"></div>
      <button class="btn btn-primary" type="submit">Change password</button>
      <span class="small muted">Forgot it? <a href="/forgot-password">Reset by email</a>.</span>
    </form>
  </div>
</div>
{% endblock %}
